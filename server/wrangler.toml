# Free plan only: SQLite-backed Durable Object class, no paid features.
name = "project-war"
main = "worker.js"
compatibility_date = "2026-11-01"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "FightRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["FightRoom"]

# serves ../dist (the single-file pages) from the Worker; free static assets, no paid features
[assets]
directory = "../dist"
binding = "ASSETS"
run_worker_first = true

[vars]
DISCORD_CLIENT_ID = "1575635299189653668"      # your Discord application id (public). The client secret is NOT stored here: wrangler secret put DISCORD_CLIENT_SECRET
