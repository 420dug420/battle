# Free plan only. Deployed by Claude through the Cloudflare connector; this is the same setup for wrangler.
name = "project-war"
main = "worker.js"
compatibility_date = "2026-11-01"

[[durable_objects.bindings]]
name = "PARTY"
class_name = "PartyRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PartyRoom"]

[vars]
DISCORD_CLIENT_ID = "1575635299189653668"      # public app id. The client secret is a Cloudflare secret, never in this file.

[[d1_databases]]
binding = "DB"
database_name = "project-war"
database_id = "8cfe8027-14b7-4e81-9404-3b56aef642ca"     # free plan D1
